name: "xml-replace-action"
description: "Replaces the text in an xml file using xpath"
inputs:
  filepath:
    description: "path in filesystem to xml file"
    required: true
  xpath:
    description: "Xpath to use when getting nodes"
    required: true
  replace:
    description: "value to replace with"
    required: false
  newvalue:
    description: "substring in value to replace (optional)"
    required: false
  operation:
    description: |
      Operation to perform: 
      - 'replace' (default): Replace text content or full node
      - 'read': Output current value of the selected node/attribute
      - 'delete': Remove the selected node or attribute
    required: false
    default: "replace"
  namespaces:
    description: |
      Array of namespaces:
      { "foo": "https://foo" }
    required: false

outputs:
  value:
    description: "value returned from read operation"

runs:
  using: "node20"
  main: "dist/index.js"
