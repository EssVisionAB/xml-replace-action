name: Test Action for Local testing
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      #
      # show initial file
      #
      - name: Show initial test.xml
        run: cat testdata/test.xml
      #
      # Replace del av @address-sträng
      #
      - name: Test 1 – Replace part of attribute value
        uses: ./
        with:
          filepath: testdata/test.xml
          xpath: "//client/endpoint/@address"
          replace: "UTVP-EVO-T01"
          newvalue: "LOCAL-ENV"

      #
      # show result of file
      #
      - name: Show test 1 result of test.xml
        run: cat testdata/test.xml

      #
      # Replace hela noden
      #
      - name: Test 2 – Replace full XML node
        uses: ./
        with:
          filepath: testdata/test.xml
          xpath: "//client/endpoint/@address"
          replace: "foobar.com"
          operation: replace

      #
      # show result of file
      #
      - name: Show test 2 result of test.xml
        run: cat testdata/test.xml

      #
      # Läs nuvarande värde av @address
      #
      - name: Test 3 – Read attribute
        id: readtest
        uses: ./
        with:
          filepath: testdata/test.xml
          xpath: "//client/endpoint/@address"
          operation: read

      - name: Show read value
        run: >
          echo "Read value: ${{ steps.readtest.outputs.value }}"

      #
      # Ta bort attributet @address
      #
      - name: Test 4 – Delete attribute
        uses: ./
        with:
          filepath: testdata/test.xml
          xpath: "//client/endpoint/@address"
          operation: delete

      #
      # Visa slutresultatet
      #
      - name: Show final test.xml
        run: cat testdata/test.xml

      #
      # Ta bort attributet <endpoint>
      #
      - name: Test 5 – Delete tag
        uses: ./
        with:
          filepath: testdata/test.xml
          xpath: "//client/endpoint"
          operation: delete

      #
      # Visa slutresultatet
      #
      - name: Show final test.xml
        run: cat testdata/test.xml

      #
      # Read endpoint inside namespace
      #
      - name: Test 6 – Read a namespace
        uses: ./
        with:
          filepath: testdata/ns_test.xml
          xpath: "//testns:configuration//testns:client/testns:endpoint"
          namespaces: |
            {"testns": "http://foobar"}
          operation: read

      #
      # Visa slutresultatet
      #
      - name: Show Test 6 result
        run: cat testdata/ns_test.xml

      #
      # Read endpoint inside namespace
      #
      - name: Test 7 – Replace something with namespace
        uses: ./
        with:
          filepath: testdata/ns_test.xml
          xpath: "//testns:client/testns:endpoint/@address"
          replace: "foobar.com"
          operation: replace
          namespaces: |
            {"testns": "http://foobar"}

      #
      # Visa slutresultatet
      #
      - name: Show Test 7 result
        run: cat testdata/ns_test.xml

      #
      # Försök ta bort en icke-existerande nod – ska ge varning, inte fel
      #
      - name: Test 8 – Delete non-existent node (expect warning)
        uses: ./
        with:
          filepath: testdata/test.xml
          xpath: "//client/nonexistentnode"
          operation: delete

      #
      # Visa resultatet efter Test 9
      #
      - name: Show Test 9 result
        run: cat testdata/test.xml

      #
      # Försök ta bort en icke-existerande nod – ska ge varning, inte fel
      #
      - name: Test 9 – Delete non-existent node (expect failure)
        uses: ./
        continue-on-error: true
        with:
          filepath: testdata/test.xml
          xpath: "//client/nonexistentnode"
          operation: delete
          failonwarning: true

      #
      # Visa resultatet efter Test 8
      #
      - name: Show Test 9 result
        run: cat testdata/test.xml

      #
      # Ersätt innehållet i <client> med flera nya poster
      #
      - name: Test 10 – Replace inner of a block with multiple new data entries
        uses: ./
        with:
          filepath: testdata/test.xml
          xpath: "//client"
          operation: replace
          replace: |
            <client>
              <endpoint name="Endpoint1" address="net.tcp://server1.example.com:1111/Service1" contract="Test.Contract.IService1" />
              <endpoint name="Endpoint2" address="net.tcp://server2.example.com:2222/Service2" contract="Test.Contract.IService2" />
              <endpoint name="Endpoint3" address="net.tcp://server3.example.com:3333/Service3" contract="Test.Contract.IService3" />
            </client>

      #
      # Visa slutresultatet
      #
      - name: Show Test 10 result
        run: cat testdata/test.xml

      #
      # Lägg till en ny endpoint sist i <client>
      #
      - name: Test 11 – Add a new node as last child
        uses: ./
        with:
          filepath: testdata/test.xml
          xpath: "//client"
          operation: add
          newvalue: '<endpoint name="Endpoint4" address="net.tcp://server4.example.com:4444/Service4" contract="Test.Contract.IService4" />'

      #
      # Visa slutresultatet
      #
      - name: Show Test 11 result
        run: cat testdata/test.xml

      #
      # Lägg till flera nya endpoints sist i <client>
      #
      - name: Test 12 – Add multiple new nodes as last children
        uses: ./
        with:
          filepath: testdata/test.xml
          xpath: "//client"
          operation: add
          newvalue: |
            <endpoint name="Endpoint5" address="net.tcp://server5.example.com:5555/Service5" contract="Test.Contract.IService5" />
            <endpoint name="Endpoint6" address="net.tcp://server6.example.com:6666/Service6" contract="Test.Contract.IService6" />

      #
      # Visa slutresultatet
      #
      - name: Show Test 12 result
        run: cat testdata/test.xml

      #
      # Försök lägga till på en icke-existerande nod – ska ge varning, inte fel
      #
      - name: Test 13 – Add to non-existent node (expect warning)
        uses: ./
        with:
          filepath: testdata/test.xml
          xpath: "//client/nonexistentnode"
          operation: add
          newvalue: '<foo>bar</foo>'

      #
      # Visa slutresultatet
      #
      - name: Show Test 13 result
        run: cat testdata/test.xml
